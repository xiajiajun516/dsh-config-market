name: 🐛 条目故障 / 下架申请 · Entry Issue / Removal Request
description: 某个条目下载失败、校验不过、内容疑似有问题，或要求下架 / An entry fails to download or validate, looks suspicious, or should be removed
title: "[条目问题/Entry Issue] "
labels: ["条目问题 / Entry Issue"]
body:
  - type: input
    id: item-id
    attributes:
      label: 出问题的条目 ID / Problematic entry ID
      placeholder: 例如 common-plugins-and-skills / e.g. common-plugins-and-skills
    validations:
      required: true
  - type: dropdown
    id: problem-type
    attributes:
      label: 问题类型 / Issue type
      options:
        - 下载/安装失败（校验不过、报错）/ Download/install failure (validation error)
        - 内容疑似含敏感信息（密钥/token）/ Content looks like it contains secrets (key/token)
        - 条目过期 / 作者要求下架 / Entry outdated / author requests removal
        - 描述不符 / 疑似骗人条目 / Misleading description / suspicious entry
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 具体情况 / Details
      description: 越具体越好：操作步骤、报错原文、截图链接等 / The more specific the better: steps, exact error text, screenshot links, etc.
      placeholder: 我做了什么 → 出现什么现象 → 报错原文（如有）/ What I did → what happened → exact error (if any)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 出问题的版本号（如知道）/ Affected version (if known)
      placeholder: 例如 1.0.0 / e.g. 1.0.0
  - type: dropdown
    id: severity
    attributes:
      label: 紧急程度 / Severity
      options:
        - 一般（可稍后处理）/ Normal (can wait)
        - 较急（影响正常使用）/ Urgent (blocks normal use)
        - 很急（疑似恶意/泄密 → 请改走 SECURITY.md 的私密报告）/ Critical (suspected malicious/leak → please use SECURITY.md private reporting instead)
    validations:
      required: true
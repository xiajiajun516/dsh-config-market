name: 💬 其他问题 / 建议 · Other Questions / Suggestions
description: 对市场本身的疑问、想法或任何其他话题 / Questions, ideas, or any other topic about the marketplace itself
title: "[其他/Other] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        对市场本身有疑问、有想法？随便写，建议和吐槽都欢迎。
        Questions or ideas about the marketplace? Write freely — suggestions and complaints are both welcome.
  - type: textarea
    id: content
    attributes:
      label: 你想说什么？/ What would you like to say?
      placeholder: 遇到的问题、想加的功能、对某个流程的意见……都可以写 / Problems you hit, features you want, opinions on a process... anything
    validations:
      required: true
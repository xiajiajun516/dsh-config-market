name: 📦 新条目 / 新分类申请 · New Entry / Category Request
description: 想收录一个新配置条目，或申请新增分类 / Request to add a new config entry, or propose a new category
title: "[新条目/New Entry] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！发完这个申请后，正式收录仍需合并对应的 PR（用插件「我的配置」一键上传会自动提 PR，是最省事的方式）。
        Thanks for contributing! After filing this request, the entry still needs a merged PR — the plugin's "My Configs" one-click upload files that PR automatically (easiest way).
  - type: input
    id: item-id
    attributes:
      label: 条目 ID / Entry ID
      description: 只含字母/数字/点/下划线/连字符，全市场唯一 / Letters, digits, dot, underscore, hyphen only; unique across the whole marketplace
      placeholder: 例如 my-config-001 / e.g. my-config-001
    validations:
      required: true
  - type: input
    id: item-name
    attributes:
      label: 条目名称（卡片上显示的名字）/ Entry name (shown on the card)
    validations:
      required: true
  - type: textarea
    id: item-desc
    attributes:
      label: 一句话描述 / One-line description
      description: 这个配置是做什么的 / What this config does
      placeholder: 例如：常用插件 + skill 合集 / e.g. a collection of common plugins + skills
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: 计划用什么方式托管 / Planned hosting method
      options:
        - 官方托管（条目内容放进本仓库 items/<id>/）/ Officially hosted (content lives in this repo's items/<id>/)
        - 作者自托管（自己有公开仓库，填 repo 引用）/ Author self-hosted (own public repo, add a repo reference)
        - 还没想好，请指教 / Not sure yet, please advise
      default: 2
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: 自托管仓库地址（选「作者自托管」时填写）/ Self-hosted repo URL (when choosing "author self-hosted")
      placeholder: https://github.com/你的名字/你的仓库 / https://github.com/your-name/your-repo
  - type: dropdown
    id: category
    attributes:
      label: 想归入哪个分类 / Desired category
      options:
        - plugins
        - skills
        - settings
        - models
        - agent-presets
        - 其他（请在下方说明）/ Other (explain below)
  - type: textarea
    id: extra
    attributes:
      label: 其他说明 / Additional notes